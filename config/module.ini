[info]
name = "Static Sitemaps"
version = "1.0.0"
author = "Agile Humanities Agency"
description = "Configurable static XML sitemaps, written to disk and served without invoking Omeka. Built to guide legitimate crawlers to content so that discovery UIs can be restricted at the network layer."
module_link = "https://github.com/agile-humanities/StaticSitemaps"
support_link = "https://github.com/agile-humanities/StaticSitemaps/issues"
author_link = "https://agilehumanities.ca/"
omeka_version_constraint = "^4.0.0"
configurable = true
license = "CeCILL v2.1"
